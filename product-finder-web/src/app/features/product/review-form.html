<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <span id="rating-label" class="label">Your rating *</span>
    <p-rating formControlName="rating" ariaLabelledBy="rating-label" />
    @if (invalid('rating')) {
      <small class="error">Please choose 1 to 5 stars.</small>
    }
  </div>

  <div class="field">
    <label for="review-title" class="label">Title</label>
    <input pInputText id="review-title" formControlName="title" maxlength="120" />
  </div>

  <div class="field">
    <label for="review-body" class="label">Your experience *</label>
    <textarea
      pTextarea
      id="review-body"
      formControlName="body"
      rows="4"
      maxlength="2000"
    ></textarea>
    @if (invalid('body')) {
      <small class="error">Please describe your experience (max. 2000 characters).</small>
    }
  </div>

  <div class="field">
    <label for="review-author" class="label">Your name or role *</label>
    <input
      pInputText
      id="review-author"
      formControlName="authorName"
      maxlength="60"
      placeholder="e.g. Formulation chemist, Lyon"
    />
    @if (invalid('authorName')) {
      <small class="error">Please enter a name (max. 60 characters).</small>
    }
  </div>

  <p-button type="submit" label="Publish review" icon="pi pi-send" [loading]="submitting()" />
  <p class="muted hint">Reviews are public and visible to all customers.</p>
</form>
