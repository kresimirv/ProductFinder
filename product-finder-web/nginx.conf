# Serves the Angular app and proxies the API, so the browser sees a single origin (no CORS).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST API and its docs (/api/v1/..., /api/docs) → NestJS.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        # Overwrite rather than append: nginx is the edge, so clients can't spoof their
        # IP, and the API's per-client review rate limit stays reliable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build output with a content hash in the file name never changes: cache for a year.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf|eot|svg)$" {  # quoted: {8} would clash with nginx braces
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is a client-side route (e.g. a shared /products/P-10007 link):
    # serve index.html, never cached, so a new deployment is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
